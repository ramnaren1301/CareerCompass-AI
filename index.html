<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b3b">
  <meta name="description" content="CareerCompass AI is a continuous WebMCP degree-to-career guide that narrows each next step from the student’s previous choice.">
  <title>CareerCompass AI — Your Degree-to-Career Guide</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./public/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell"><div class="boot-screen"><div class="boot-mark">C</div><strong>CareerCompass AI</strong><span>Preparing your guided degree-to-career journey…</span></div></div>
  <noscript>CareerCompass AI requires JavaScript to run the interactive roadmap and WebMCP tools.</noscript>
  <script type="module">
    const isLocal = ["localhost", "127.0.0.1", "::1", "[::1]"].includes(location.hostname);
    if (isLocal && "serviceWorker" in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations
        .filter((registration) => registration.scope.startsWith(location.origin))
        .map((registration) => registration.unregister()));
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter((key) => key.startsWith("careercompass-ai-")).map((key) => caches.delete(key)));
      }
    }
    await import("./src/app.js?v=3.0.0");
  </script>
</body>
</html>
